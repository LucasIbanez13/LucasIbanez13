<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <style>
    .s{animation:tw 3s ease-in-out infinite}
    .d1{animation-delay:.5s}.d2{animation-delay:1s}.d3{animation-delay:1.5s}.d4{animation-delay:2s}.d5{animation-delay:2.5s}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
    .line{stroke-dasharray:1100;animation:dash 6s linear infinite}
    .l2{animation-delay:1.2s}
    @keyframes dash{0%{stroke-dashoffset:1100}50%{stroke-dashoffset:0}100%{stroke-dashoffset:-1100}}
    .ga{animation:ga 2.5s ease-in-out infinite}
    .gb{animation:gb 2.5s ease-in-out infinite}
    @keyframes ga{0%,100%{transform:translateX(0)}33%{transform:translateX(3px)}66%{transform:translateX(-3px)}}
    @keyframes gb{0%,100%{transform:translateX(0)}33%{transform:translateX(-3px)}66%{transform:translateX(3px)}}
  </style>
  <defs>
    <radialGradient id="sky" cx="50%" cy="55%" r="75%">
      <stop offset="0%" stop-color="#1f3dff"/><stop offset="45%" stop-color="#0d1a8c"/><stop offset="100%" stop-color="#030628"/>
    </radialGradient>
    <radialGradient id="pink" cx="85%" cy="30%" r="35%">
      <stop offset="0%" stop-color="#ff3fd2" stop-opacity=".45"/><stop offset="100%" stop-color="#ff3fd2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aqua" cx="12%" cy="25%" r="30%">
      <stop offset="0%" stop-color="#3dffc8" stop-opacity=".35"/><stop offset="100%" stop-color="#3dffc8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streak" x1="0" x2="1">
      <stop offset="0%" stop-color="#ff1f4b" stop-opacity="0"/><stop offset="50%" stop-color="#ff1f4b"/><stop offset="100%" stop-color="#ff3fd2" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="spark" d="M0,-12 L2.5,-2.5 L12,0 L2.5,2.5 L0,12 L-2.5,2.5 L-12,0 L-2.5,-2.5 Z"/>
  </defs>

  <rect width="1200" height="320" fill="url(#sky)"/>
  <rect width="1200" height="320" fill="url(#pink)"/>
  <rect width="1200" height="320" fill="url(#aqua)"/>

  <!-- estrellas -->
  <g fill="#fff">
    <circle class="s" cx="472" cy="45" r="1.6"/><circle class="s d1" cx="923" cy="223" r="1.7"/>
    <circle class="s d2" cx="1126" cy="120" r="1.3"/><circle class="s d3" cx="79" cy="183" r="1.3"/>
    <circle class="s d4" cx="1139" cy="278" r="1.4"/><circle class="s d5" cx="548" cy="37" r="1.5"/>
    <circle class="s d1" cx="205" cy="188" r="1.7"/><circle class="s d3" cx="706" cy="296" r="1.4"/>
    <circle class="s d2" cx="996" cy="11" r="1.3"/><circle class="s d4" cx="356" cy="46" r="1.4"/>
    <circle class="s d5" cx="104" cy="268" r="1.4"/><circle class="s" cx="902" cy="49" r="1.3"/>
  </g>
  <g fill="#c9d4ff">
    <circle class="s d2" cx="29" cy="141" r="1.6"/><circle class="s d4" cx="327" cy="281" r="1.5"/>
    <circle class="s d1" cx="852" cy="30" r="1.8"/><circle class="s d3" cx="231" cy="65" r="1.7"/>
    <circle class="s d5" cx="642" cy="20" r="1"/><circle class="s" cx="537" cy="294" r="1.6"/>
  </g>
  <g fill="#3dffc8">
    <circle class="s d3" cx="996" cy="281" r="1.3"/><circle class="s" cx="1060" cy="154" r="1.3"/>
    <circle class="s d4" cx="150" cy="220" r="1.4"/><circle class="s d1" cx="1169" cy="266" r="1.5"/>
    <circle class="s d5" cx="317" cy="236" r="1.3"/><circle class="s d2" cx="1158" cy="91" r="1.4"/>
  </g>
  <g fill="#ff3fd2">
    <circle class="s d1" cx="1088" cy="109" r="1.5"/><circle class="s d3" cx="415" cy="281" r="1.2"/>
    <circle class="s" cx="971" cy="164" r="1.4"/><circle class="s d4" cx="437" cy="24" r="1.5"/>
    <circle class="s d2" cx="1170" cy="230" r="1.7"/><circle class="s d5" cx="256" cy="91" r="1.3"/>
  </g>

  <!-- destellos -->
  <g filter="url(#glow)">
    <use href="#spark" class="s" transform="translate(110 70)" fill="#3dffc8"/>
    <use href="#spark" class="s d2" transform="translate(1090 60) scale(1.2)" fill="#ff3fd2"/>
    <use href="#spark" class="s d4" transform="translate(1010 260) scale(.8)" fill="#3dffc8"/>
    <use href="#spark" class="s d3" transform="translate(190 260) scale(.9)" fill="#ff3fd2"/>
    <use href="#spark" class="s d1" transform="translate(600 40) scale(.7)" fill="#fff"/>
  </g>

  <!-- trazo neón -->
  <g filter="url(#soft)" fill="none">
    <path class="line" d="M150,240 C380,200 520,270 760,225 S1000,190 1080,215" stroke="url(#streak)" stroke-width="2.5"/>
    <path class="line l2" d="M120,260 C360,230 560,290 800,250 S1020,225 1100,240" stroke="url(#streak)" stroke-width="1.5" opacity=".7"/>
  </g>

  <!-- texto con glitch -->
  <g font-family="'Courier New', Consolas, monospace" font-weight="700" text-anchor="middle">
    <text class="ga" x="603" y="158" font-size="84" fill="#3dffc8" opacity=".55">LucasIbanez13</text>
    <text class="gb" x="597" y="152" font-size="84" fill="#ff1f4b" opacity=".6">LucasIbanez13</text>
    <text x="600" y="155" font-size="84" fill="#fff" filter="url(#glow)">LucasIbanez13</text>
    <text x="600" y="203" font-size="20" font-weight="400" fill="#c9d4ff" letter-spacing="4">&lt;/&gt; full-stack dev · freelancer · night coder</text>
  </g>
</svg>
